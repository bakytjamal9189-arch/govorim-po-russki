<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="ГОВОРИМ ПО-РУССКИ — Учимся играя! Орыс тілін 1-сынып оқушыларына үйретуге арналған интерактивті платформа.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22%3E%3Crect x=%222%22 y=%226%22 width=%2250%22 height=%2240%22 rx=%2214%22 fill=%22%232ec4f1%22/%3E%3Ctext x=%2227%22 y=%2236%22 text-anchor=%22middle%22 font-size=%2224%22 font-weight=%22900%22 fill=%22white%22 font-family=%22sans-serif%22%3EАа%3C/text%3E%3C/svg%3E">
<title>ГОВОРИМ ПО-РУССКИ — Учимся играя!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&subset=cyrillic,cyrillic-ext&display=swap" rel="stylesheet">
<style>:root{
  --blue:#2ec4f1; --blue-d:#0b8fc0; --yellow:#ffd23f; --green:#3ddc84; --green-d:#16a35a; --pink:#ff5fa2; --purple:#8b6cff; --orange:#ff8a3d; --teal:#20c5b5; --gold:#f5b70a; --red:#ef4444;
  --ink:#1f2a44; --ink-2:#4a5677; --bg:#f2fbff; --card:#fff; --line:#dbe9f3; --shadow:0 6px 0 rgba(31,42,68,.08),0 10px 24px rgba(31,42,68,.08);
  --r:24px; --font:"Nunito","Trebuchet MS","Segoe UI",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:var(--font);color:var(--ink);background:var(--bg);font-size:20px;line-height:1.35;-webkit-tap-highlight-color:transparent;
  background-image:radial-gradient(circle at 10% 10%,#dff6ff 0,transparent 30%),radial-gradient(circle at 90% 20%,#fff4cf 0,transparent 25%),radial-gradient(circle at 80% 90%,#ffe3f0 0,transparent 30%),radial-gradient(circle at 15% 85%,#e2fbe9 0,transparent 30%);background-attachment:fixed;min-height:100vh}
button{font-family:inherit;color:inherit;cursor:pointer;-webkit-user-select:none;user-select:none;touch-action:manipulation}
button:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible,input:focus-visible,select:focus-visible{outline:4px solid var(--purple);outline-offset:2px}
#app{max-width:1180px;margin:0 auto;padding:0 14px 40px}
.kk{color:var(--ink-2);font-size:.82em;font-weight:600}
.note{color:var(--ink-2);font-size:16px}
.center{text-align:center}

/* --- top bar --- */
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:10px 0;background:linear-gradient(var(--bg) 70%,transparent)}
.icon-btn{width:56px;height:56px;border-radius:18px;border:0;background:#fff;box-shadow:var(--shadow);font-size:28px;display:grid;place-items:center;flex:none}
.icon-btn:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.08)}
.tb-title{flex:1;font-weight:900;font-size:24px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.logo-mini{display:grid;place-items:center}
.chip{display:flex;align-items:center;gap:8px;border:0;background:#fff;border-radius:999px;padding:6px 14px 6px 6px;box-shadow:var(--shadow);font-weight:800;font-size:18px;max-width:260px}
.chip .ava{font-size:30px;width:44px;height:44px;border-radius:50%;background:#eef7ff;display:grid;place-items:center}
.chip-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip-stars{color:#b77d00;white-space:nowrap}

/* --- buttons --- */
.btn{border:0;border-radius:18px;padding:12px 20px;font-weight:800;font-size:19px;background:#fff;box-shadow:0 5px 0 rgba(31,42,68,.12);transition:transform .08s}
.btn:active:not(:disabled){transform:translateY(4px);box-shadow:0 1px 0 rgba(31,42,68,.12)}
.btn.big{padding:16px 24px;font-size:22px;min-height:64px}
.btn.huge{padding:18px 34px;font-size:26px;min-height:76px;border-radius:24px}
.btn.primary{background:var(--blue);color:#fff;box-shadow:0 5px 0 var(--blue-d)}
.btn.good{background:var(--green);color:#063;box-shadow:0 5px 0 var(--green-d)}
.btn.danger{background:#ffe1e1;color:#a11}
.btn.ghost{background:#fff}
.btn.sm{padding:8px 12px;font-size:16px;border-radius:12px;min-height:40px}
.btn.mic{background:var(--pink);color:#fff;box-shadow:0 5px 0 #d63b80}
.btn.mic.listening{animation:pulse 1s infinite}
.c-blue{background:#d7f3ff}.c-green{background:#dcfbe8}.c-yellow{background:#fff3c4}.c-pink{background:#ffe0ef}.c-purple{background:#ebe5ff}.c-orange{background:#ffe6d4}.c-teal{background:#d5f7f3}.c-gold{background:#fff0c2}
.btn.c-blue{background:#c9eeff}.btn.c-green{background:#c8f7da}.btn.c-yellow{background:#ffe98e}.btn.c-purple{background:#ddd3ff}.btn.c-teal{background:#bff2ec}
.row-btns{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin:14px 0}
.linkbtn{border:0;background:none;color:var(--blue-d);text-decoration:underline;font-size:16px;margin-top:10px}

/* --- home --- */
.hero{position:relative;display:grid;grid-template-columns:1fr auto;align-items:center;background:linear-gradient(135deg,#7fdcff,#2ec4f1 60%,#3aa7ff);border-radius:34px;padding:22px 26px;color:#fff;box-shadow:var(--shadow);overflow:hidden;margin-top:6px}
.hero::after{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;background:rgba(255,255,255,.15)}
.brand{display:flex;gap:16px;align-items:center}
.brand-logo{background:#fff;border-radius:22px;padding:6px;display:grid;place-items:center;box-shadow:0 6px 0 rgba(0,0,0,.08)}
.brand-title{margin:0;font-size:46px;line-height:1;font-weight:900;letter-spacing:1px;text-shadow:0 4px 0 rgba(0,0,0,.12)}
.slogan{display:inline-block;margin-top:10px;background:var(--yellow);color:var(--ink);font-weight:900;font-size:24px;padding:6px 18px;border-radius:999px;transform:rotate(-2deg);box-shadow:0 4px 0 #d9a800}
.hero-owl{border:0;background:none;padding:0;z-index:1}
.hero-bubble{position:absolute;right:190px;top:18px;background:#fff;color:var(--ink);padding:10px 16px;border-radius:18px 18px 4px 18px;font-weight:900;font-size:20px;box-shadow:var(--shadow);z-index:1}
.owl .owl-body{animation:bob 3s ease-in-out infinite;transform-origin:100px 180px}
.owl .eyes{animation:blink 4s infinite;transform-origin:100px 84px}
@keyframes bob{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-6px) rotate(-2deg)}}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
.level-card{display:flex;align-items:center;gap:16px;width:100%;margin:18px 0;border:0;background:#fff;border-radius:var(--r);padding:14px 18px;box-shadow:var(--shadow);text-align:left}
.lvl-num{width:62px;height:62px;border-radius:50%;background:var(--yellow);font-size:34px;font-weight:900;display:grid;place-items:center;flex:none;box-shadow:0 4px 0 #d9a800}
.lvl-text{flex:1;font-size:22px}
.lvl-go{font-weight:900;color:var(--blue-d);white-space:nowrap}
.assign{background:#fff7d6;border:3px dashed var(--gold);border-radius:var(--r);padding:12px 16px;margin-bottom:16px}
.assign-title{font-weight:900;font-size:22px;margin-bottom:8px}
.assign-item{display:flex;align-items:center;gap:10px;width:100%;border:0;background:#fff;border-radius:16px;padding:12px;margin:6px 0;font-weight:800;font-size:20px;box-shadow:0 3px 0 rgba(0,0,0,.06);text-align:left}
.ai-emoji{font-size:30px}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.tiles.small{grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}
.tile{position:relative;border:0;border-radius:28px;padding:20px 12px;min-height:170px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;box-shadow:var(--shadow);transition:transform .12s;text-align:center}
.tile:hover{transform:translateY(-3px)}
.tile:active{transform:translateY(3px)}
.tile-emoji{font-size:62px;line-height:1;filter:drop-shadow(0 4px 0 rgba(0,0,0,.08))}
.tile-title{font-weight:900;font-size:22px}
.tile-sub{font-size:16px;color:var(--ink-2);font-weight:700}
.tile.locked{filter:grayscale(.8);opacity:.6}
.tile-badge{position:absolute;top:10px;right:12px;background:var(--pink);color:#fff;font-weight:900;font-size:15px;border-radius:999px;padding:3px 10px}
.home-foot{display:flex;justify-content:center;margin-top:26px}
.teacher-btn{font-size:18px;background:#fff}

/* --- shared --- */
.screen{animation:fadein .25s}
@keyframes fadein{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.owl-says{display:flex;align-items:center;gap:12px;margin:8px 0 16px}
.owl-btn{border:0;background:none;padding:0;flex:none}
.bubble{background:#fff;border-radius:22px;padding:12px 18px;box-shadow:var(--shadow);position:relative;font-weight:800;font-size:23px}
.bubble::before{content:"";position:absolute;left:-12px;top:50%;margin-top:-10px;border:10px solid transparent;border-right-color:#fff;border-left:0}
.owl-says.small .bubble{font-size:20px}
.center-msg{display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;padding:20px}
.err{font-size:13px;background:#fff;padding:8px;border-radius:8px;max-width:100%;overflow:auto}
.pic{display:inline-grid;place-items:center;line-height:1}
.pic.emoji{font-size:64px}
.pic.sm{font-size:34px}.pic.sm img{width:44px;height:44px}
.pic.md{font-size:58px}.pic.md img{width:80px;height:80px}
.pic.lg{font-size:78px}.pic.lg img{width:110px;height:110px}
.pic.xl{font-size:110px}.pic.xl img{width:150px;height:150px}
.pic.xxl{font-size:160px}.pic.xxl img{width:220px;height:220px}
.pic img{object-fit:contain;border-radius:16px}
.swatch{display:block;width:1.1em;height:1.1em;border-radius:50%;border:4px solid #fff;box-shadow:0 0 0 3px var(--line),0 6px 12px rgba(0,0,0,.12)}
.speak-btn{border:0;border-radius:50%;width:56px;height:56px;background:var(--yellow);font-size:28px;box-shadow:0 4px 0 #d9a800;flex:none}
.speak-btn.big{width:72px;height:72px;font-size:36px}
.pulse{animation:pulse .5s}
@keyframes pulse{0%{transform:scale(1)}40%{transform:scale(1.12)}100%{transform:scale(1)}}
.shake{animation:shake .45s}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-10px)}40%{transform:translateX(10px)}60%{transform:translateX(-7px)}80%{transform:translateX(7px)}}
.dots{display:flex;gap:8px;justify-content:center;margin:6px 0 12px;flex-wrap:wrap}
.dots i{width:18px;height:18px;border-radius:50%;background:#d6e6f2}
.dots i.done{background:var(--green)}.dots i.cur{background:var(--blue);transform:scale(1.25)}
.prompt{display:flex;align-items:center;gap:16px;background:#fff;border-radius:var(--r);padding:12px 18px;box-shadow:var(--shadow);margin-bottom:16px}
.prompt-text{font-size:28px;font-weight:900}
.q-show{display:flex;justify-content:center;margin:6px 0 16px}
.options{display:grid;gap:16px;margin:0 auto;max-width:900px}
.options.cols-2{grid-template-columns:repeat(2,1fr);max-width:640px}
.options.cols-3{grid-template-columns:repeat(3,1fr)}
.options.cols-4{grid-template-columns:repeat(4,1fr)}
.opt{border:5px solid transparent;background:#fff;border-radius:28px;min-height:170px;padding:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;box-shadow:var(--shadow);transition:transform .1s}
.opt:hover{transform:translateY(-3px)}
.opt.right{border-color:var(--green);background:#e5fff0;animation:pop .5s}
.opt.right::after{content:"✔";position:absolute;font-size:44px;color:var(--green-d)}
.opt{position:relative}
.opt.right::after{top:6px;right:14px}
.opt.wrong{border-color:#ffb4b4;background:#fff0f0;opacity:.55}
@keyframes pop{0%{transform:scale(1)}50%{transform:scale(1.08)}100%{transform:scale(1)}}
.opt-word{font-weight:900;font-size:24px}
.opt-word.big{font-size:34px}
.quiz.ok .prompt{background:#e5fff0}
.mletter{font-size:64px;font-weight:900;color:var(--purple)}
.mletter.lo{color:var(--pink)}
.mletter.huge{font-size:130px}
.syl{font-size:52px;font-weight:900;letter-spacing:2px;color:var(--blue-d)}
.mword{font-size:30px;font-weight:900}
.intro-line{text-align:center}
.hint{text-align:center;font-weight:800;color:var(--ink-2)}
.big-say{font-size:46px;font-weight:900;text-align:center;margin:10px 0}
.counter{text-align:center;font-weight:900;font-size:30px;margin:10px 0}

/* --- result --- */
.result{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;padding:10px}
.result h2{font-size:34px;margin:0}
.stars-row{display:flex;gap:10px}
.star{font-size:80px;color:#e3e9ef;line-height:1}
.star.on{color:var(--gold);animation:starin .6s both;text-shadow:0 5px 0 #d79a00}
@keyframes starin{0%{transform:scale(0) rotate(-90deg)}70%{transform:scale(1.25)}100%{transform:scale(1)}}
.result-info{font-size:26px;font-weight:900;display:flex;flex-direction:column}
.result-total{font-size:22px;font-weight:800;background:#fff;padding:8px 18px;border-radius:999px;box-shadow:var(--shadow)}
.levelup{background:linear-gradient(90deg,var(--yellow),var(--pink));padding:12px 22px;border-radius:20px;font-weight:900;font-size:26px;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.15);margin:10px 0;text-align:center}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:100;overflow:hidden}
.confetti i{position:absolute;top:-20px;width:12px;height:18px;border-radius:3px;animation:fall 2.4s ease-in forwards}
@keyframes fall{to{top:110vh;transform:rotate(720deg)}}

/* --- builder & match --- */
.slots{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:10px 0 22px}
.slot{min-width:70px;height:84px;border-radius:18px;border:4px dashed #b9d3e6;display:grid;place-items:center;font-size:44px;font-weight:900;background:#fff;padding:0 10px}
.slots.words .slot{min-width:110px;font-size:30px}
.slot.filled{border-style:solid;border-color:var(--blue);background:#e6f8ff;animation:pop .3s}
.slots.complete .slot{border-color:var(--green);background:#e5fff0}
.pool{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.token{border:0;min-width:84px;min-height:84px;border-radius:20px;background:var(--yellow);box-shadow:0 6px 0 #d9a800;font-size:40px;font-weight:900;padding:0 16px}
.token.used{visibility:hidden}
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:24px;max-width:760px;margin:0 auto}
.mcol{display:flex;flex-direction:column;gap:14px}
.mcard{border:5px solid transparent;background:#fff;border-radius:22px;min-height:100px;box-shadow:var(--shadow);display:grid;place-items:center;padding:8px}
.mcard.sel{border-color:var(--blue);background:#e6f8ff;transform:scale(1.03)}
.mcard.done{border-color:var(--green);background:#e5fff0;opacity:.6;pointer-events:none}

/* --- path --- */
.levels{display:flex;flex-direction:column;gap:14px}
.lvl{background:#fff;border-radius:var(--r);padding:14px 18px;box-shadow:var(--shadow);border:4px solid transparent}
.lvl.cur{border-color:var(--yellow)}
.lvl.closed{opacity:.55}
.lvl-head{display:flex;align-items:center;gap:14px}
.lvl-head>div{flex:1}
.lvl-badge{font-size:40px}
.lvl-count{font-weight:900;color:var(--ink-2)}
.lvl-tasks{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;margin-top:12px}
.lvl-task{display:flex;gap:10px;align-items:center;border:0;background:#f3f8fc;border-radius:16px;padding:12px;font-weight:800;font-size:18px;text-align:left}
.lvl-task.done{background:#e5fff0}

/* --- abc --- */
.lgroup{background:#fff;border-radius:var(--r);padding:14px;margin:14px 0;box-shadow:var(--shadow)}
.lgroup.locked{opacity:.55}
.lgroup-title{font-weight:900;font-size:20px;margin-bottom:10px}
.lgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:12px}
.ltile{position:relative;border:0;border-radius:22px;min-height:100px;background:#e7f1ff;font-weight:900;box-shadow:0 5px 0 #c3d6ee;font-size:44px;color:var(--blue-d)}
.ltile.vowel{background:#ffe3ef;color:#d6286f;box-shadow:0 5px 0 #f3b9d2}
.ltile.sign{background:#eee;color:#555}
.ltile.got{outline:4px solid var(--gold)}
.ltile.sel{transform:scale(1.08);outline:5px solid var(--purple)}
.lt-check{position:absolute;top:2px;right:6px;font-size:20px}
.letter-card{display:flex;flex-direction:column;align-items:center;gap:10px}
.big-letter{display:flex;width:fit-content;margin:0 auto;gap:30px;align-items:baseline;font-weight:900;cursor:pointer;background:#fff;border-radius:40px;padding:10px 46px;box-shadow:var(--shadow)}
.big-letter .up{font-size:170px;color:var(--purple);line-height:1.05}
.big-letter .lo{font-size:130px;color:var(--pink);line-height:1.05}
.big-letter.anim{animation:pop .8s}
.word-show{display:flex;align-items:center;gap:20px;border:0;background:#fff;border-radius:var(--r);padding:12px 26px;box-shadow:var(--shadow)}
.ws-word{font-size:46px;font-weight:900}
.hlword b{color:var(--pink);font-size:1.15em;text-decoration:underline;text-decoration-thickness:4px}
.kk-note{background:#fff7d6;border-radius:18px;padding:10px 16px;font-size:17px;font-weight:700;max-width:700px}

/* --- lesson --- */
.stagebar{display:flex;gap:6px;justify-content:center;margin:6px 0 10px;flex-wrap:wrap}
.stg{width:46px;height:46px;border-radius:50%;background:#e4edf5;display:grid;place-items:center;font-size:22px}
.stg.done{background:var(--green);color:#fff;font-weight:900}
.stg.cur{background:var(--yellow);transform:scale(1.18);box-shadow:0 3px 0 #d9a800}
.stage-head{text-align:center}
.stage-head h2{margin:4px 0 0;font-size:30px}
.lesson .next{display:block;margin:20px auto 0}
.sound-box{display:flex;gap:24px;align-items:center;justify-content:center;flex-wrap:wrap;margin:18px 0}
.sound-big{border:0;width:200px;height:200px;border-radius:50%;background:radial-gradient(circle at 30% 30%,#fff3,transparent),var(--green);color:#fff;font-size:70px;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 8px 0 var(--green-d);animation:pulse 2s infinite}
.sound-big span{font-size:36px;font-weight:900}
.sound-explain{background:#fff;border-radius:var(--r);padding:16px 20px;box-shadow:var(--shadow);font-size:24px;max-width:460px}
.cards3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;max-width:860px;margin:0 auto}
.wcard{border:0;background:#fff;border-radius:26px;padding:16px;box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;gap:6px;position:relative}
.wc-word{font-size:30px;font-weight:900}
.wc-tap{position:absolute;top:8px;right:12px;font-size:24px}
.find-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;max-width:820px;margin:0 auto}
.ftile{border:0;aspect-ratio:1;border-radius:20px;background:#fff;box-shadow:var(--shadow);font-size:52px;font-weight:900;color:var(--ink)}
.ftile.right{background:var(--green);color:#fff;animation:pop .4s}
.ftile.wrong{background:#ffd5d5}
.repeat{display:flex;flex-direction:column;align-items:center;gap:8px}
.repeat-btns{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
.repeat.compact .btn.big{font-size:18px;min-height:56px;padding:10px 16px}
.heard{text-align:center;font-size:20px;font-weight:800}
.good-text{color:var(--green-d)}.warn-text{color:#b45309}.heard-text{color:var(--ink-2)}

/* --- words --- */
.wordview{max-width:760px;margin:0 auto}
.wcard-big{background:#fff;border-radius:36px;padding:20px;box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;gap:8px}
.wb-pic{border:0;background:#f4fbff;border-radius:30px;padding:10px 40px;min-height:240px;display:grid;place-items:center}
.wb-word{font-size:58px;font-weight:900}
.kk-reveal{font-size:30px;font-weight:900;color:#0a7a52;min-height:0;transition:.2s}
.kk-reveal.on{background:#e5fff0;padding:6px 18px;border-radius:16px}
.nav-arrows{display:flex;justify-content:center;align-items:center;gap:24px;margin-top:16px}
.arrow{border:0;width:84px;height:84px;border-radius:50%;background:var(--blue);color:#fff;font-size:38px;box-shadow:0 6px 0 var(--blue-d)}
.nav-count{font-weight:900;font-size:24px}

/* --- reading --- */
.known{text-align:center;font-weight:800;margin-bottom:14px}
.known b{display:inline-block;margin:3px;padding:2px 10px;border-radius:10px;font-size:26px}

'use strict';

/* ---------- DOM көмекшілері ---------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
function h(tag, props, ...kids) {
  const el = document.createElement(tag);
  if (props) for (const [k, v] of Object.entries(props)) {
    if (v == null || v === false) continue;
    if (k === 'class') el.className = v;
    else if (k === 'html') el.innerHTML = v;
    else if (k === 'style' && typeof v === 'object') Object.assign(el.style, v);
    else if (k.startsWith('on') && typeof v === 'function') el.addEventListener(k.slice(2).toLowerCase(), v);
    else if (k === 'value') el.value = v;
    else if (v === true) el.setAttribute(k, '');
    else el.setAttribute(k, v);
  }
  for (const c of kids.flat(Infinity)) {
    if (c == null || c === false) continue;
    el.append(c.nodeType ? c : document.createTextNode(String(c)));
  }
  return el;
}
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = (p = 'id') => p + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const pick = a => a[Math.floor(Math.random() * a.length)];
const sample = (a, n) => shuffle(a).slice(0, n);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const clone = o => JSON.parse(JSON.stringify(o));
const norm = s => String(s || '').toLowerCase().replace(/ё/g, 'е').replace(/[^a-zа-яәіңғүұқөһ0-9 ]/gi, ' ').replace(/\s+/g, ' ').trim();
const fmtDate = t => { try { return new Date(t).toLocaleString('ru-RU', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' }); } catch { return String(t); } };

/* ---------- Платформа (claude.ai артефакт ортасы болса) ---------- */
const PLATFORM = { db: null, user: null, uid: null, downloads: null, sample: null, dictation: null, tts: null, ready: false };
async function initPlatform() {
  if (!(window.claude && typeof window.claude.use === 'function')) { PLATFORM.ready = true; return; }
  const get = n => window.claude.use(n).catch(() => null);
  const [db, user, downloads, smp, dictation, tts] = await Promise.all(['db', 'user', 'downloads', 'sample', 'dictation', 'tts'].map(get));
  Object.assign(PLATFORM, { db, user, downloads, sample: smp, dictation, tts });
  try { PLATFORM.uid = user ? await user.id() : null; } catch { PLATFORM.uid = null; }
  PLATFORM.ready = true;
}

const STORE_KEY = 'govorim_po_russki_v1';
let DB = null;
const STORAGE = { local: true, remote: false, remoteStatus: '', lastError: '' };

function newDB() {
  return {
    version: 1, updatedAt: 0,
    settings: {
      soundOn: true, volume: 0.9, rate: 0.8, voiceURI: '', showKazakh: true, groupSize: 4,
      closedModules: [], aiEndpoint: '', pinHash: '', pinSalt: '', recoveryHash: '',
      pinFails: 0, lockUntil: 0, classTitle: '1 «А» сынып',
    },
    content: buildSeed(),
    media: {},
    students: [],
    currentStudentId: null,
  };
}
function newStudent(name, avatar) {
  return {
    id: uid('st'), name: name || 'Ученик', avatar: avatar || pick(AVATARS), createdAt: Date.now(),
    levelMode: 'auto', manualLevel: 1,
    p: { points: 0, stars: 0, correct: 0, wrong: 0, done: {}, awarded: {}, wordHits: {}, letters: [], badges: [], mistakes: [], seen: {}, lastActive: 0 },
    assignments: [],
  };
}
function migrate(d) {
  const base = newDB();
  d.settings = Object.assign(base.settings, d.settings || {});
  d.content = d.content || base.content;
  for (const k of Object.keys(base.content)) if (d.content[k] == null) d.content[k] = base.content[k];
  d.media = d.media || {};
  d.students = d.students || [];
  for (const s of d.students) {
    const t = newStudent();
    s.p = Object.assign(t.p, s.p || {});
    s.assignments = s.assignments || [];
    if (!s.levelMode) s.levelMode = 'auto';
  }
  return d;
}
function loadDB() {
  let raw = null;
  try { raw = localStorage.getItem(STORE_KEY); } catch (e) { STORAGE.local = false; }
  try { DB = raw ? migrate(JSON.parse(raw)) : newDB(); } catch (e) { console.error(e); DB = newDB(); }
  ensureStudent();
}
function ensureStudent() {
  if (!DB.students.length) DB.students.push(newStudent('Ученик', '🦊'));
  if (!DB.students.find(s => s.id === DB.currentStudentId)) DB.currentStudentId = DB.students[0].id;
}
let saveTimer = null;
function save() {
  DB.updatedAt = Date.now();
  try { localStorage.setItem(STORE_KEY, JSON.stringify(DB)); STORAGE.local = true; STORAGE.lastError = ''; }
  catch (e) {
    STORAGE.local = false; STORAGE.lastError = String(e && e.name || e);
    toast('⚠️ Деректер сақталмады: браузер жады толы немесе жабық. Мұғалім кабинетінде сақтық көшірме жасаңыз.', 'bad', 6000);
  }
  clearTimeout(saveTimer); saveTimer = setTimeout(remotePush, 2500);

      const ref = col(ci) + (ri + 1); const st = ri === 0 ? ' s="1"' : '';

/* ---------- SHA-256 (PIN хэші; crypto.subtle жоқ ортаға арналған қосалқы нұсқа) ---------- */
function sha256js(ascii) {
  const r = (v, a) => (v >>> a) | (v << (32 - a)); const K = []; const H = []; let p = 2, c = 0;
  const isP = n => { for (let f = 2; f * f <= n; f++) if (n % f === 0) return false; return true; };
  while (c < 64) { if (isP(p)) { if (c < 8) H[c] = (Math.pow(p, 1 / 2) * 4294967296) | 0; K[c++] = (Math.pow(p, 1 / 3) * 4294967296) | 0; } p++; }
  const bytes = Array.from(new TextEncoder().encode(ascii)); const l = bytes.length * 8; bytes.push(0x80);
  while (bytes.length % 64 !== 56) bytes.push(0);
  for (let i = 7; i >= 0; i--) bytes.push(i >= 4 ? 0 : (l >>> (i * 8)) & 0xff);
  const w = []; let hh = H.slice();
  for (let j = 0; j < bytes.length; j += 64) {
    for (let i = 0; i < 16; i++) w[i] = (bytes[j + i * 4] << 24) | (bytes[j + i * 4 + 1] << 16) | (bytes[j + i * 4 + 2] << 8) | bytes[j + i * 4 + 3];
    for (let i = 16; i < 64; i++) { const s0 = r(w[i - 15], 7) ^ r(w[i - 15], 18) ^ (w[i - 15] >>> 3), s1 = r(w[i - 2], 17) ^ r(w[i - 2], 19) ^ (w[i - 2] >>> 10); w[i] = (w[i - 16] + s0 + w[i - 7] + s1) | 0; }
    let [a, b, cc, d, e, f, g, hv] = hh;
    for (let i = 0; i < 64; i++) {
      const t1 = (hv + (r(e, 6) ^ r(e, 11) ^ r(e, 25)) + ((e & f) ^ (~e & g)) + K[i] + w[i]) | 0;
      const t2 = ((r(a, 2) ^ r(a, 13) ^ r(a, 22)) + ((a & b) ^ (a & cc) ^ (b & cc))) | 0;
      hv = g; g = f; f = e; e = (d + t1) | 0; d = cc; cc = b; b = a; a = (t1 + t2) | 0;
    }
    hh = [a, b, cc, d, e, f, g, hv].map((v, i) => (v + hh[i]) | 0);
  }
  return hh.map(v => (v >>> 0).toString(16).padStart(8, '0')).join('');
}
async function sha256(s) {
  try { if (crypto && crypto.subtle) { const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s)); return Array.from(new Uint8Array(b)).map(x => x.toString(16).padStart(2, '0')).join(''); } } catch { }

}
async function hashPin(pin, salt) { let x = salt + ':' + pin; for (let i = 0; i < 500; i++) x = await sha256(x + salt); return x; }

/* ---------- Сурет/аудио файлды оқу ---------- */
function readFileAsDataURL(file) { return new Promise((res, rej) => { const fr = new FileReader(); fr.onload = () => res(fr.result); fr.onerror = rej; fr.readAsDataURL(file); }); }
async function imageToDataURL(file, max = 320) {
  const src = await readFileAsDataURL(file);
  const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = src; });
  const k = Math.min(1, max / Math.max(img.width, img.height)); const cv = document.createElement('canvas');
  cv.width = Math.round(img.width * k); cv.height = Math.round(img.height * k);
  cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
  return cv.toDataURL(file.type === 'image/png' ? 'image/png' : 'image/jpeg', 0.85);
}

/* ---------- Қозғалтқыш 1: Таңдау тапсырмалары (quiz) ---------- */
/* q: {say, show, options:[{id, el, label}], correct, item, wordId, cols, after} */
function runQuiz(cfg) {
  const { key, questions, title } = cfg; let qi = 0, mistakes = 0;
  const root = h('div', { class: 'quiz' });
  const done = () => {
    const stars = mistakes === 0 ? 3 : mistakes <= 2 ? 2 : 1;
    const r = completeActivity(key, stars);
    cfg.onDone && cfg.onDone(stars);
    showResult({ title: cfg.doneTitle || title, stars, gained: r.gained, levelUp: r.levelUp, again: () => cfg.restart ? cfg.restart() : go(NAV.stack[NAV.stack.length - 1].name, NAV.stack[NAV.stack.length - 1].params, true), next: cfg.next });
  };
  const show = () => {
    const q = questions[qi]; let firstTry = true, locked = false;
    root.innerHTML = '';
    root.append(progressDots(qi, questions.length));
    const prompt = h('div', { class: 'prompt' },
      h('button', { class: 'speak-btn big', 'aria-label': 'Повторить задание', onclick: e => { pulse(e.currentTarget); say(q.say, { audio: q.audio }); } }, '🔊'),
      h('div', { class: 'prompt-text' }, q.text || q.say, q.kk ? kk(q.kk) : null));
    root.append(prompt);
    if (q.show) root.append(h('div', { class: 'q-show' }, q.show));
    const grid = h('div', { class: 'options cols-' + (q.cols || Math.min(q.options.length, 4)) });
    q.options.forEach(o => {
      const b = h('button', { class: 'opt', 'aria-label': o.label || '' }, o.el);
      b.onclick = async () => {
        if (locked || b.classList.contains('wrong')) return;
        if (o.id === q.correct) {
          locked = true; b.classList.add('right'); root.classList.add('ok');
          if (firstTry) { award(q.item || key + ':' + qi); hitWord(q.wordId); } else ME().p.correct++;
          save();
          await praise(); if (q.after) await say(q.after);
          await sleep(350); root.classList.remove('ok');
          qi++; if (qi < questions.length) show(); else done();
        } else {
          b.classList.add('wrong'); shake(b);
          if (firstTry) { mistakes++; logMistake(title, q.text || q.say, o.label, (q.options.find(x => x.id === q.correct) || {}).label); save(); }
          firstTry = false; tryAgain();
        }
      };
      grid.append(b);
    });
    root.append(grid);
    setTimeout(() => say(q.say, { audio: q.audio }), 300);
  };
  if (!questions.length) return emptyMsg('Пока нет заданий.', 'Тапсырмалар әлі жоқ.');
  show();
  return h('div', null, cfg.intro ? h('div', { class: 'intro-line' }, cfg.intro) : null, root);
}

/* ---------- Қозғалтқыш 2: Құрастыру (сөз, буын, сөйлем) ---------- */
/* rounds: [{tokens:[...], joiner, show, say, item, wordId, label}] */
function runBuilder(cfg) {
  const { key, rounds, title } = cfg; let ri = 0, mistakes = 0;
  const root = h('div', { class: 'builder' });
  const show = () => {
    const r = rounds[ri]; let pos = 0, firstTry = true;
    root.innerHTML = '';
    root.append(progressDots(ri, rounds.length));
    root.append(h('div', { class: 'prompt' }, h('button', { class: 'speak-btn big', onclick: e => { pulse(e.currentTarget); say(r.say); } }, '🔊'),
      h('div', { class: 'prompt-text' }, cfg.promptText || 'Собери!', cfg.promptKk ? kk(cfg.promptKk) : null)));
    if (r.show) root.append(h('div', { class: 'q-show' }, r.show));
    const slots = h('div', { class: 'slots' + (r.joiner === ' ' ? ' words' : '') }, r.tokens.map(() => h('span', { class: 'slot' }, '')));
    root.append(slots);
    const pool = h('div', { class: 'pool' });
    shuffle(r.tokens.map((t, i) => ({ t, i }))).forEach(({ t }) => {
      const b = h('button', { class: 'token' }, t);
      b.onclick = async () => {
        if (b.disabled) return;
        if (norm(t) === norm(r.tokens[pos])) {
          b.disabled = true; b.classList.add('used');
          const s = slots.children[pos]; s.textContent = t; s.classList.add('filled'); pos++;
          if (r.joiner !== ' ' && t.length <= 3) say(t, { rate: 0.8 });
          if (pos === r.tokens.length) {
            slots.classList.add('complete');
            if (firstTry) { award(r.item); hitWord(r.wordId); } else ME().p.correct++;
            save();
            await sleep(400); await say(r.say); await praise(); await sleep(300);
            ri++; if (ri < rounds.length) show(); else finish();
          }
        } else {
          shake(b); if (firstTry) { mistakes++; logMistake(title, r.label || r.tokens.join(r.joiner), t, r.tokens[pos]); save(); }
          firstTry = false; tryAgain();
        }
      };
      pool.append(b);
    });
    root.append(pool);
    setTimeout(() => say(r.say), 300);
  };
  const finish = () => {
    const stars = mistakes === 0 ? 3 : mistakes <= 2 ? 2 : 1; const res = completeActivity(key, stars);
    showResult({ title, stars, gained: res.gained, levelUp: res.levelUp, again: () => go(NAV.stack[NAV.stack.length - 1].name, NAV.stack[NAV.stack.length - 1].params, true) });
  };
  if (!rounds.length) return emptyMsg('Пока нет заданий.', 'Тапсырмалар әлі жоқ.');
  show(); return root;
}

/* ---------- Қозғалтқыш 3: Сәйкестендіру (жұп табу) ---------- */
/* pairs: [{id, left, right, sayLeft, sayRight, item, wordId, label}] */
function runMatch(cfg) {
  const { key, pairs, title } = cfg; let sel = null, matched = 0, mistakes = 0;
  const root = h('div', { class: 'match' });
  root.append(h('div', { class: 'prompt' }, h('button', { class: 'speak-btn big', onclick: e => { pulse(e.currentTarget); say(cfg.say); } }, '🔊'), h('div', { class: 'prompt-text' }, cfg.text || cfg.say, cfg.kk ? kk(cfg.kk) : null)));
  const L = h('div', { class: 'mcol' }), R = h('div', { class: 'mcol' });
  const mk = (p, side) => {
    const b = h('button', { class: 'mcard ' + side }, side === 'l' ? p.left : p.right); b.dataset.id = p.id;
    b.onclick = async () => {
      if (b.classList.contains('done')) return;
      const txt = side === 'l' ? p.sayLeft : p.sayRight; if (txt) say(txt);
      if (!sel || sel.side === side) { if (sel) sel.el.classList.remove('sel'); sel = { el: b, side, p }; b.classList.add('sel'); return; }
      const a = sel; sel = null; a.el.classList.remove('sel');
      if (a.p.id === p.id) {
        a.el.classList.add('done'); b.classList.add('done'); matched++;
        if (!a.p._wrong) { award(p.item); hitWord(p.wordId); } else ME().p.correct++;
        tone('good'); save();
        if (matched === pairs.length) { await sleep(500); await praise(); const stars = mistakes === 0 ? 3 : mistakes <= 2 ? 2 : 1; const r = completeActivity(key, stars); showResult({ title, stars, gained: r.gained, levelUp: r.levelUp, again: () => go(NAV.stack[NAV.stack.length - 1].name, NAV.stack[NAV.stack.length - 1].params, true) }); }
      } else {
        shake(a.el); shake(b); mistakes++; const lp = side === 'l' ? p : a.p; lp._wrong = true;
        logMistake(title, (lp.label || ''), (side === 'l' ? a.p : p).label || '', lp.label || ''); save(); tryAgain();
      }
    };
    return b;
  };
  shuffle(pairs).forEach(p => L.append(mk(p, 'l'))); shuffle(pairs).forEach(p => R.append(mk(p, 'r')));
  root.append(h('div', { class: 'mgrid' }, L, R));
  setTimeout(() => say(cfg.say), 300);
  return root;
}

/* Сөйлеуді тану тек көмекші: бұл толық сөйлеу бағалауы ЕМЕС. */
function repeatWidget(text, { onDone, audio, kkText, compact } = {}) {
  const target = String(text).replace(/\{name\}/g, ME().name);
  const out = h('div', { class: 'heard' });
  const finishBtn = h('button', { class: 'btn big good', onclick: () => { tone('good'); say('Молодец!'); onDone && onDone(true); finishBtn.disabled = true; finishBtn.textContent = '✅ Молодец!'; } }, '✅ Я повторил(а)!');
  const micBtn = canRecognize() ? h('button', { class: 'btn big mic' }, '🎤 Скажи') : null;
  if (micBtn) micBtn.onclick = async () => {
    stopSpeech(); out.innerHTML = ''; micBtn.disabled = true; micBtn.textContent = '👂 Слушаю…'; micBtn.classList.add('listening');
    const r = await listenOnce(state => { if (state === 'idle') micBtn.classList.remove('listening'); });
    micBtn.disabled = false; micBtn.textContent = '🎤 Скажи ещё'; micBtn.classList.remove('listening');
    if (r.error) {
      if (['not-allowed', 'not_granted', 'unsupported', 'service-not-allowed', 'start'].includes(r.error)) {
        micBtn.remove(); out.append(h('p', { class: 'kk' }, '🎙️ Микрофон қолжетімсіз. Тыңда да, дауыстап қайтала, содан соң жасыл батырманы бас.'));
      } else out.append(h('p', null, '🤔 Я ничего не услышал. Скажи громче!'), kk('Ештеңе естілмеді. Қаттырақ айт.'));
      return;
    }
    const sim = Math.max(...[r.text, ...(r.alts || [])].map(t => similarity(t, target)));
    out.append(h('p', { class: 'heard-text' }, '👂 Я услышал: «' + r.text + '»'));
    if (sim >= 0.6) { out.append(h('p', { class: 'good-text' }, '🌟 Похоже! Молодец!')); praise(); onDone && onDone(true); finishBtn.disabled = true; finishBtn.textContent = '✅ Молодец!'; }
    else { out.append(h('p', { class: 'warn-text' }, '🙂 Послушай ещё раз и повтори.')); tryAgain(); }
  };
  return h('div', { class: 'repeat' + (compact ? ' compact' : '') },
    h('div', { class: 'repeat-btns' },
      h('button', { class: 'btn big primary', onclick: e => { pulse(e.currentTarget); say(target, { audio }); } }, '🔊 Послушай'),
      h('button', { class: 'btn big ghost', onclick: () => say(target, { audio, rate: 0.6 }) }, '🐢 Медленно'),
      micBtn, finishBtn),
    out);
}

function optCountForLevel(lvl = levelOf()) { return lvl <= 1 ? 2 : lvl <= 3 ? 3 : 4; }

function findPrompt(w) {

  if (COLOR_HEX[r]) return 'Найди ' + r + ' цвет.';
  if (/[ая]$/.test(r) && !/(ие|ые)$/.test(r)) { const acc = r.replace(/а$/, 'у').replace(/я$/, 'ю'); return pick(['Найди ', 'Покажи ']) + acc + '.'; }
  if (ANIMATE_MASC.includes(r) || /[иы]$/.test(r)) return 'Где ' + r + '?';
  const v = pick(['Покажи ', 'Найди ', 'Где ']); return v + r + (v === 'Где ' ? '?' : '.');
}

    const others = sample(pool.filter(x => x.id !== w.id && x.ru !== w.ru), opts - 1);
    let p = prompt(w); if (p.startsWith('Где ') && !p.endsWith('?')) p = p.replace(/\.$/, '?');
    return { say: p, text: p, audio: '', options: shuffle([w, ...others]).map(o => ({ id: o.id, el: pic(o, 'lg'), label: o.ru })), correct: w.id, item: key + ':' + w.id, wordId: w.id, after: w.ru };
  });
  return runQuiz({ key, title, questions: qs });
}

function masteredSets() {
  const st = ME(); const L = orderedLetters().filter(l => st.p.letters.includes(l.id));
  const vowels = L.filter(l => l.kind === 'vowel' && !'ЕЁЮЯ'.includes(l.id)).concat(L.filter(l => 'ЕЁЮЯ'.includes(l.id)));
  const cons = L.filter(l => l.kind === 'cons' && l.id !== 'Й');
  const set = new Set(L.map(l => l.lower)); return { L, vowels, cons, set };
}
const canRead = (word, set) => Array.from(word.replace(/-/g, '')).every(ch => set.has(ch));
function syllables() { const { vowels, cons } = masteredSets(); const out = []; cons.forEach(c => vowels.forEach(v => out.push(c.lower + v.lower))); return out; }
function readableWords() { const { set } = masteredSets(); return C().readingWords.filter(w => canRead(w.syll, set)); }

/* ---------- Сынып статистикасы және экспорт ---------- */
function exportRows() {

  DB.students.forEach(s => { const m = studentSummary(s); summary.push([s.name, m.lvl, s.p.stars, s.p.points, s.p.correct, s.p.wrong, m.tasks, m.letters, orderedLetters().filter(l => s.p.letters.includes(l.id)).map(l => l.upper).join(' '), m.words, s.p.badges.map(b => (topicById(b) || {}).ru).join(', '), s.p.lastActive ? fmtDate(s.p.lastActive) : '']); });
  const mistakes = [['Оқушы', 'Уақыт', 'Бөлім', 'Тапсырма', 'Оқушы таңдады', 'Дұрыс жауап']];
  DB.students.forEach(s => s.p.mistakes.forEach(x => mistakes.push([s.name, fmtDate(x.t), x.a, x.q, x.c, x.r])));
  const topics = [['Оқушы', ...C().topics.map(t => t.ru)]];
  DB.students.forEach(s => topics.push([s.name, ...C().topics.map(t => { const ws = topicWords(t); return ws.length ? Math.round(ws.filter(w => wordMastered(w.id, s)).length / ws.length * 100) : 0; })]));
  const letters = [['Оқушы', ...orderedLetters().map(l => l.upper)]];
  DB.students.forEach(s => letters.push([s.name, ...orderedLetters().map(l => s.p.letters.includes(l.id) ? '✔' : '')]));
  return { summary, mistakes, topics, letters };
}

  } else if (mode.kind === 'phrases') {
    (data.phrases || []).filter(p => p && p.ru).forEach(p => box.append(row([['emoji', '❓', 'xs'], ['ru', 'орысша'], ['kk', 'қазақша']], p)));
    box.append(tbtn('✅ Бекіту: «Говорим вместе → Сөйлемдер» бөліміне қосу', () => { const c = chosen(); c.forEach(p => C().phrases.push({ id: uid('ph'), ru: String(p.ru).trim(), kk: String(p.kk || '').trim(), emoji: String(p.emoji || '💬').trim(), group: 'sent' })); save(); toast('✅ ' + c.length + ' фраза қосылды.', 'good'); box.remove(); }, 'primary'));
  } else if (mode.kind === 'dictation') {
    const title = inp(data.title || 'Сөздік диктант', 'Атауы'); box.append(field('Атауы', title));
    (data.items || []).filter(x => x && x.ru).forEach(x => box.append(row([['ru', 'сөз'], ['kk', 'аударма']], x)));
    box.append(tbtn('✅ Бекіту және сақтау', () => { C().aiNotes.unshift({ title: title.value, items: chosen(), at: Date.now() }); save(); toast('✅ Диктант сақталды.', 'good'); rerender(); }, 'primary'));
  } else {
    const title = inp(data.title || 'Задание', 'Атауы'), kkI = inp(data.kk || '', 'Қазақша');
    box.append(h('div', { class: 'form-grid' }, field('Атауы', title), field('Қазақша', kkI)));
    (data.tasks || []).filter(t => t && t.prompt && Array.isArray(t.options)).forEach(t => {
      t.correct = Math.max(0, Math.min(t.options.length - 1, t.correct | 0));
      const cb = h('input', { type: 'checkbox', checked: true }); rows.push({ cb, obj: t });
      box.append(h('div', { class: 'task-edit' }, h('div', { class: 'row' }, cb, inp(t.prompt, '', { oninput: e => { t.prompt = e.target.value; } }), tbtn('🔊', () => say(t.prompt))),
        t.options.map((o, oi) => h('div', { class: 'row opt-edit' }, h('label', { class: 'chk' }, h('input', { type: 'radio', name: 'rv' + t.prompt + oi, checked: t.correct === oi, onchange: () => { t.correct = oi; $$('input[type=radio]', cb.closest('.task-edit')).forEach((r, k) => { r.checked = k === oi; }); } }), 'дұрыс'),
          inp(o.emoji || '', '', { class: 'inp xs', oninput: e => { o.emoji = e.target.value; } }), inp(o.label || '', '', { oninput: e => { o.label = e.target.value; } })))));
    });
    const st = DB.students.find(s => s.id === ctx.student);
    box.append(tbtn('✅ Бекіту: тапсырма жиынтығы ретінде сақтау' + (mode.id === 'student' && st ? ' және ' + st.name + '-ға тағайындау' : ''), () => {
      const tasks = chosen().map(t => ({ prompt: String(t.prompt).trim(), options: t.options.map(o => ({ label: String(o.label || '').trim(), emoji: String(o.emoji || '').trim() })).filter(o => o.label), correct: t.correct })).filter(t => t.options.length >= 2);
      if (!tasks.length) return toast('Тапсырма таңдалмаған.', 'warn');
      const set = { id: uid('set'), title: title.value.trim() || 'Задание', kk: kkI.value.trim(), level: mode.id === 'game' ? ctx.level : 1, approved: true, ai: true, tasks };
      C().taskSets.push(set);
      if (mode.id === 'student' && st) st.assignments.push({ id: uid('as'), key: 'listen:set:' + set.id, at: Date.now(), done: 0 });
      save(); toast('✅ Сақталды' + (mode.id === 'student' && st ? ' және тағайындалды' : '') + '.', 'good'); box.remove();
    }, 'primary'));
  }
  if (!rows.length) box.append(h('p', { class: 'err-text' }, 'ЖИ жарамды материал қайтармады. Қайталап көріңіз.'));
  return box;
}

/* ---------- Баптаулар ---------- */
function tSettings() {
  const s = DB.settings; const kb = dbSizeKB();
  const fileIn = h('input', { type: 'file', accept: '.json,application/json', style: { display: 'none' } });
  fileIn.onchange = async () => { const f = fileIn.files[0]; if (!f) return;
    try { const txt = await f.text(); const d = JSON.parse(txt); if (!d || !d.content || !Array.isArray(d.students)) throw new Error('format');
      if (!await confirmBox('Сақтық көшірмені қалпына келтіру', 'Қазіргі барлық дерек файлдағы деректермен ауыстырылады.', 'Ауыстыру')) return;
      const pin = { pinHash: s.pinHash, pinSalt: s.pinSalt, recoveryHash: s.recoveryHash };
      DB = migrate(d); if (!DB.settings.pinHash) Object.assign(DB.settings, pin); ensureStudent(); save(); toast('✅ Деректер қалпына келтірілді.', 'good'); rerender();
    } catch (e) { toast('❌ Файл жарамсыз.', 'bad'); } };
  const pinChange = async () => {
    const o = inp('', 'Ескі PIN', { type: 'password', inputmode: 'numeric' }), n1 = inp('', 'Жаңа PIN', { type: 'password', inputmode: 'numeric' });
    if (!await modal('PIN-ді өзгерту', h('div', null, o, n1), [{ label: 'Болдырмау', value: false }, { label: 'Сақтау', value: true, primary: true }])) return;
    if ((await hashPin(o.value, s.pinSalt)) !== s.pinHash) return toast('❌ Ескі PIN қате.', 'bad');
    if (!/^\d{4,8}$/.test(n1.value)) return toast('PIN 4–8 цифр болуы керек.', 'bad');
    s.pinHash = await hashPin(n1.value, s.pinSalt); save(); toast('✅ PIN өзгертілді.', 'good');
  };
  const remote = PLATFORM.db && PLATFORM.uid;
  return h('div', null, h('h2', null, '⚙️ Баптаулар'),
    h('div', { class: 't-card' }, h('h3', null, 'Жалпы'), field('Сынып атауы', inp(s.classTitle, '1 «А» сынып', { onchange: e => { s.classTitle = e.target.value; save(); } })),
      h('label', { class: 'chk big' }, h('input', { type: 'checkbox', checked: s.showKazakh, onchange: e => { s.showKazakh = e.target.checked; save(); } }), '🇰🇿 Оқушы бетінде қазақша көмекші жазуларды көрсету'),
      h('div', { class: 'row' }, tbtn('🔊 Дыбыс баптаулары', soundPanel), tbtn('🔐 PIN-ді өзгерту', pinChange))),
    h('div', { class: 't-card ' + (remote ? '' : 'warn-card') }, h('h3', null, '💾 Деректерді сақтау'),
      remote ? h('p', null, '✅ Деректер осы браузерде және сіздің claude.ai аккаунтыңызда (серверде) сақталады. Басқа құрылғыдан осы бетті ашсаңыз, нәтижелер жүктеледі. ' + (STORAGE.remoteStatus || ''))
        : h('p', null, '⚠️ Демонстрациялық режим: деректер тек ОСЫ браузер мен ОСЫ құрылғыда (localStorage) сақталады. Басқа компьютерде нәтижелер көрінбейді. Браузер деректерін тазаласаңыз, нәтижелер өшеді — сақтық көшірмені жүйелі түрде жүктеп алыңыз.'),
      h('p', null, 'Деректер көлемі: ~' + kb + ' КБ (браузер шегі шамамен 5000 КБ).' + (STORAGE.local ? '' : ' ❌ Соңғы сақтау сәтсіз: ' + STORAGE.lastError)),
      h('div', { class: 'row' }, tbtn('⬇️ Сақтық көшірме (JSON)', () => downloadFile('govorim-backup-' + stamp() + '.json', JSON.stringify(DB), 'application/json'), 'primary'), tbtn('⬆️ Көшірмені қалпына келтіру', () => fileIn.click()), fileIn,
        remote ? tbtn('☁️ Серверге қазір сақтау', async () => { await remotePush(); toast(STORAGE.remoteStatus); rerender(); }) : null)),
    h('div', { class: 't-card danger-zone' }, h('h3', null, '⚠️ Қауіпті аймақ'),
      tbtn('♻️ Контентті бастапқы күйге қайтару', async () => { if (await confirmBox('Контентті қайтару', 'Әріптер, сөздер, тақырыптар, тапсырмалар бастапқы күйге қайтарылады. Оқушы нәтижелері сақталады.', 'Қайтару')) { DB.content = buildSeed(); gcMedia(); save(); rerender(); } }, 'danger'),
      tbtn('🧨 Барлық деректі өшіру', async () => { if (await confirmBox('Барлығын өшіру', 'Барлық оқушы, нәтиже, контент және PIN өшіріледі. Алдымен сақтық көшірме жасаңыз!', 'Бәрін өшіру')) { DB = newDB(); ensureStudent(); save(); TEACHER.until = 0; home(); } }, 'danger')),
    h('p', { class: 'note' }, 'Қауіпсіздік: PIN хэштеліп сақталады, 5 қате әрекеттен кейін 1 минутқа бұғатталады, кабинет 15 минут әрекетсіздіктен кейін автоматты жабылады. Ескерту: бұл браузер ішіндегі қорғаныс; ол балалардан қорғайды, бірақ техникалық маманнан толық қорғамайды.'));
}

/* Іске қосу */
'use strict';
async function boot() {
  loadDB();
  refreshVoices();
  NAV.stack = [{ name: 'home', params: {} }];
  render();
  window.addEventListener('beforeunload', () => { try { localStorage.setItem(STORE_KEY, JSON.stringify(DB)); } catch { } });
  await initPlatform();
  if (PLATFORM.db && PLATFORM.uid) {
    const changed = await remotePull();
    if (changed) { NAV.stack = [{ name: 'home', params: {} }]; render(); toast('☁️ Деректер серверден жүктелді.', 'good'); }
    else if (STORAGE.remote && DB.updatedAt) remotePush();
  }
}
document.addEventListener('DOMContentLoaded', boot);
</script>
</body>
</html>
